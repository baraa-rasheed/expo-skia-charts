name: Publish to npm

# Publishes react-native-skia-chart when a GitHub Release is published or a v* tag is pushed.
# The tag (without the leading "v") must match the version in package.json.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  # Manual run from the Actions tab publishes whatever version is in package.json on the chosen branch.
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - run: npm run typecheck
        if: steps.check.outputs.skip != 'true'

      - run: npm run build
        if: steps.check.outputs.skip != 'true'

      - run: npm publish --access public --provenance
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
